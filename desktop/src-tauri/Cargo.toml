[package]
name = "agent-system"
version = "0.1.0"
edition = "2021"

[lib]
name = "agent_system"
crate-type = ["rlib"]

[[bin]]
name = "agent-system"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:rfd", "dep:tauri-build"]
verification = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }
base64 = "0.22"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-single-instance = { version = "2", optional = true }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
