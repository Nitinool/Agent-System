[package]
name = "task-notes"
version = "0.1.0"
edition = "2021"

[lib]
name = "task_notes"
crate-type = ["rlib"]

[[bin]]
name = "task-notes"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification", "dep:rfd", "dep:windows-sys"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "11", features = ["no-serde-warnings"] }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
rfd = { version = "0.15", optional = true }
windows-sys = { version = "0.61", features = ["Win32_System_Registry"], optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
